<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Notebook &mdash; Your Name</title>
<meta name="description" content="Essays, photography, poetry, and creative explorations by Your Name.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,:before,:after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#faf8f5;--surface:#fff;--text:#2c2a28;--text-s:#8a8580;--text-l:#b5afa8;
  --accent:#c45d3e;--accent-soft:rgba(196,93,62,.08);--accent-h:#a84a2f;
  --brd:#e8e4df;--brd-l:#f0ece7;--warm:#f5f0ea;
  --serif:'Source Serif 4',Georgia,serif;
  --display:'Fraunces',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --max-w:720px;--wide-w:960px;--tr:.3s ease;
}
html{scroll-behavior:smooth;}
body{font-family:var(--serif);background:var(--bg);color:var(--text);line-height:1.8;font-size:17px;min-height:100vh;min-height:100dvh;}

/* === HEADER === */
.site-header{
  padding:20px 32px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:50;
  backdrop-filter:blur(16px);background:rgba(255,255,255,.85);gap:16px;
}
.site-logo{font-family:var(--display);font-size:1.3rem;font-weight:700;color:var(--text);text-decoration:none;letter-spacing:-.5px;flex-shrink:0;}
.site-logo span{color:var(--accent);}
.site-nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.site-nav a{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--text-s);text-decoration:none;transition:color var(--tr);position:relative;white-space:nowrap;}
.site-nav a:hover{color:var(--accent);}
.site-nav a.active{color:var(--accent);}
.site-nav a.active::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;background:var(--accent);border-radius:2px;}
.back-link{
  font-family:var(--sans);font-size:.8rem;font-weight:500;color:var(--text-s);
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border:1px solid var(--brd);border-radius:8px;transition:all var(--tr);
}
.back-link:hover{border-color:var(--accent);color:var(--accent);}

/* mobile menu */
.mob-menu-btn{display:none;width:36px;height:36px;border:1px solid var(--brd);border-radius:8px;background:transparent;cursor:pointer;place-items:center;color:var(--text-s);}
.mob-menu-btn svg{width:20px;height:20px;}

/* === HERO === */
.hero{max-width:var(--wide-w);margin:0 auto;padding:60px 32px 50px;text-align:center;}
.hero h1{font-family:var(--display);font-size:2.8rem;font-weight:700;letter-spacing:-1.5px;line-height:1.15;margin-bottom:14px;}
.hero p{font-size:1.05rem;color:var(--text-s);max-width:500px;margin:0 auto;font-style:italic;font-weight:300;}

/* === FILTERS === */
.filter-bar{max-width:var(--wide-w);margin:0 auto;padding:0 32px 32px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.filter-btn{
  font-family:var(--sans);font-size:.8rem;font-weight:500;padding:6px 16px;
  border:1px solid var(--brd);border-radius:24px;background:transparent;
  color:var(--text-s);cursor:pointer;transition:all var(--tr);
}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* === POST GRID === */
.posts-grid{
  max-width:var(--wide-w);margin:0 auto;padding:0 32px 50px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;
}
.post-card{
  background:var(--surface);border:1px solid var(--brd-l);border-radius:12px;
  overflow:hidden;transition:all var(--tr);cursor:pointer;
  opacity:0;animation:fadeUp .5s ease forwards;
}
.post-card:nth-child(1){animation-delay:.05s;}.post-card:nth-child(2){animation-delay:.1s;}.post-card:nth-child(3){animation-delay:.15s;}.post-card:nth-child(4){animation-delay:.2s;}.post-card:nth-child(5){animation-delay:.25s;}.post-card:nth-child(6){animation-delay:.3s;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.post-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.06);border-color:var(--brd);}
.post-card-img{width:100%;height:180px;object-fit:cover;display:block;background:var(--warm);}
.post-card-body{padding:20px 22px 24px;}
.post-card-cat{font-family:var(--sans);font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin-bottom:8px;}
.post-card-body h2{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.3;margin-bottom:6px;letter-spacing:-.3px;}
.post-card-body .excerpt{font-size:.88rem;color:var(--text-s);line-height:1.6;margin-bottom:10px;}
.post-card-footer{display:flex;justify-content:space-between;align-items:center;font-family:var(--sans);font-size:.76rem;color:var(--text-l);}

/* === SINGLE POST === */
.post-view{display:none;}
.post-view.active{display:block;}
.posts-listing.hidden{display:none;}
.post-header{max-width:var(--max-w);margin:0 auto;padding:50px 32px 28px;text-align:center;}
.post-header .post-cat{font-family:var(--sans);font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin-bottom:14px;display:inline-block;}
.post-header h1{font-family:var(--display);font-size:2.2rem;font-weight:700;letter-spacing:-1px;line-height:1.2;margin-bottom:10px;}
.post-header .post-meta{font-family:var(--sans);font-size:.82rem;color:var(--text-s);}
.post-header .post-meta span{margin:0 6px;color:var(--brd);}
.post-cover{max-width:var(--wide-w);margin:0 auto 36px;padding:0 32px;}
.post-cover img{width:100%;border-radius:12px;display:block;}
.post-content{max-width:var(--max-w);margin:0 auto;padding:0 32px 70px;}
.post-content p{margin-bottom:18px;}
.post-content h2{font-family:var(--display);font-size:1.4rem;font-weight:600;margin:36px 0 14px;letter-spacing:-.5px;}
.post-content h3{font-family:var(--display);font-size:1.15rem;font-weight:600;margin:28px 0 10px;}
.post-content blockquote{border-left:3px solid var(--accent);margin:24px 0;padding:4px 0 4px 22px;font-style:italic;color:var(--text-s);}
.post-content img{width:100%;border-radius:8px;margin:22px 0;}
.post-content .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:24px 0;}
.post-content .gallery img{height:180px;object-fit:cover;margin:0;cursor:pointer;transition:transform .3s;}
.post-content .gallery img:hover{transform:scale(1.02);}
.post-content .poem{font-style:italic;line-height:2.2;padding:22px 28px;margin:24px 0;background:var(--warm);border-radius:10px;border-left:3px solid var(--accent);}
.post-back-btn{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:none;padding:0;margin-bottom:20px;transition:color var(--tr);}
.post-back-btn:hover{color:var(--accent-h);}

/* === FOOTER === */
.site-footer{border-top:1px solid var(--brd);padding:36px 32px;text-align:center;font-family:var(--sans);font-size:.8rem;color:var(--text-l);}
.site-footer a{color:var(--accent);text-decoration:none;}
.site-footer a:hover{text-decoration:underline;}

/* === RESPONSIVE === */
@media(max-width:700px){
  .site-header{padding:14px 16px;flex-wrap:wrap;}
  .site-nav{gap:12px;}
  .site-nav a{font-size:.78rem;}
  .mob-menu-btn{display:grid;}
  .site-nav.collapsed{display:none;}
  .site-nav.expanded{display:flex;width:100%;justify-content:center;padding-top:8px;}
  .hero{padding:40px 16px 30px;}
  .hero h1{font-size:2rem;}
  .filter-bar,.posts-grid,.post-header,.post-content,.post-cover{padding-left:16px;padding-right:16px;}
  .post-header h1{font-size:1.6rem;}
  .posts-grid{grid-template-columns:1fr;gap:16px;}
  .post-content .gallery{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
}
@media(max-width:380px){
  .hero h1{font-size:1.7rem;}
  .filter-btn{padding:5px 12px;font-size:.74rem;}
}
@media(min-width:701px){
  .mob-menu-btn{display:none !important;}
}
</style>
</head>
<body>

<header class="site-header">
  <a href="#" class="site-logo" onclick="showListing();return false;">The <span>Notebook</span></a>
  <button class="mob-menu-btn" onclick="toggleMobNav()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <nav class="site-nav" id="site-nav">
    <a href="#" class="active" onclick="showListing();return false;">All Posts</a>
    <a href="#" onclick="filterAndShow('essay');return false;">Essays</a>
    <a href="#" onclick="filterAndShow('photography');return false;">Photography</a>
    <a href="#" onclick="filterAndShow('poetry');return false;">Poetry</a>
    <!-- UPDATE THIS LINK to your actual academic site URL -->
    <a href="https://sanjay-das-in.github.io" class="back-link">&larr; Academic Site</a>
  </nav>
</header>

<div class="posts-listing" id="posts-listing">
  <section class="hero">
    <h1>Words, Images &amp;<br>Wanderings</h1>
    <p>Essays, photographs, poems, and creative explorations beyond the research lab.</p>
  </section>
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" onclick="filterPosts('all')">All</button>
    <button class="filter-btn" onclick="filterPosts('essay')">Essays</button>
    <button class="filter-btn" onclick="filterPosts('photography')">Photography</button>
    <button class="filter-btn" onclick="filterPosts('poetry')">Poetry</button>
    <button class="filter-btn" onclick="filterPosts('creative')">Creative</button>
  </div>
  <div class="posts-grid" id="posts-grid"></div>
</div>

<div class="post-view" id="post-view">
  <div class="post-header">
    <button class="post-back-btn" onclick="showListing()">&larr; Back to all posts</button>
    <div class="post-cat" id="pv-cat"></div>
    <h1 id="pv-title"></h1>
    <div class="post-meta"><span id="pv-date"></span> <span>&middot;</span> <span id="pv-read"></span></div>
  </div>
  <div class="post-cover" id="pv-cover-wrap"></div>
  <article class="post-content" id="pv-body"></article>
</div>

<footer class="site-footer">
  <p>&copy; 2024 Your Name &middot; <a href="https://yourusername.github.io">Academic Portfolio</a> &middot; Made with care</p>
</footer>

<script>
/* ============ BLOG DATA ============ */
/* Add / edit posts here. Each post = one object. */
var blogPosts = [
  {
    id: "why-research",
    title: "Why I Chose Research Over Industry",
    category: "essay",
    date: "April 15, 2024",
    readTime: "5 min read",
    excerpt: "The decision wasn\u2019t straightforward. After two rewarding internships, I found myself drawn back to academia.",
    cover: "https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800",
    body: '<p>The decision wasn\u2019t straightforward. After two rewarding internships at tech companies, I found myself drawn back to the open-ended nature of academic research.</p><p>What ultimately tipped the scale was the freedom to ask my own questions. In industry, the problems are defined by product needs. In academia, I could chase ideas that kept me up at night.</p><blockquote>The best research doesn\u2019t come from knowing what you\u2019re looking for. It comes from being comfortable with not knowing.</blockquote><p>That\u2019s not to say industry is lesser \u2014 it\u2019s profoundly different. It taught me to think about impact, scalability, and real users in ways that strengthen my research today.</p><h2>Advice for Those Deciding</h2><p>Try both if you can. Do at least one serious internship and one serious research project. Pay attention to when you feel most alive. The answer is usually in the doing, not the deliberating.</p>'
  },
  {
    id: "reading-ml-papers",
    title: "A Beginner\u2019s Guide to Reading ML Papers",
    category: "essay",
    date: "February 20, 2024",
    readTime: "7 min read",
    excerpt: "When I started my PhD, reading papers felt like deciphering ancient scrolls. Here\u2019s the system I developed.",
    cover: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=800",
    body: '<p>When I started my PhD, reading papers felt like deciphering ancient scrolls. Here\u2019s the three-pass system I developed.</p><h2>First Pass \u2014 10 Minutes</h2><p>Read the title, abstract, intro, section headings, and conclusion. You should now know what the paper claims and roughly how.</p><h2>Second Pass \u2014 30 Minutes</h2><p>Read the whole thing but skip proofs and dense math. Focus on figures and tables \u2014 they\u2019re the real story.</p><h2>Third Pass \u2014 1-2 Hours</h2><p>Only if you need to reproduce the work. Engage with every equation and assumption. This is where real understanding happens.</p><blockquote>Reading a paper is not the same as understanding it. Understanding requires actively reconstructing the argument in your own words.</blockquote>'
  },
  {
    id: "street-photography",
    title: "Light Between Buildings",
    category: "photography",
    date: "March 8, 2024",
    readTime: "2 min read",
    excerpt: "A photo essay on finding extraordinary light in ordinary urban spaces.",
    cover: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800",
    body: '<p>There\u2019s a particular quality of light in cities between 4 and 5 PM \u2014 when the sun threads through gaps between buildings, casting long golden corridors across pavement and faces.</p><div class="gallery"><img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=400" alt="Urban light"><img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=400" alt="City"><img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=400" alt="Street"><img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?w=400" alt="Architecture"><img src="https://images.unsplash.com/photo-1444723121867-7a241cacace9?w=400" alt="Skyline"><img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=400" alt="Urban"></div><p>I shoot exclusively on a Fuji X100V \u2014 its fixed lens forces me to move, to commit to a frame. Constraints breed creativity.</p>'
  },
  {
    id: "gradient-descent-poem",
    title: "Gradient Descent \u2014 A Poem",
    category: "poetry",
    date: "March 1, 2024",
    readTime: "1 min read",
    excerpt: "A poem about optimization, uncertainty, and the search for something good enough.",
    cover: null,
    body: '<div class="poem">We step, uncertain, down the slope,<br>each iteration a quiet hope<br>that loss will shrink, that weights will learn,<br>that somewhere past the noise, a turn<br>reveals the minimum we seek \u2014<br>not global, maybe, but unique.<br><br>The learning rate \u2014 too bold, too shy \u2014<br>determines if we soar or die<br>in oscillations, stuck in place,<br>or overshoot with too much grace.<br><br>And yet we trust the algorithm\u2019s way:<br>that small corrections, day by day,<br>will bring us closer to the ground<br>where something beautiful is found.</div><p>Written during a frustrating hyperparameter search at 2 AM. Sometimes the best way to understand an algorithm is to feel it.</p>'
  },
  {
    id: "debugging-3am",
    title: "On Debugging at 3 AM",
    category: "creative",
    date: "January 12, 2024",
    readTime: "3 min read",
    excerpt: "There\u2019s a peculiar clarity that arrives at 3 AM, after the coffee has worn off.",
    cover: "https://images.unsplash.com/photo-1504639725590-34d0984388bd?w=800",
    body: '<p>There\u2019s a peculiar clarity that arrives at 3 AM, after the coffee has worn off and the office has emptied. The bug you\u2019ve been chasing all day suddenly feels less like an adversary and more like a puzzle left by a previous version of yourself.</p><p>You read the stack trace one more time. And there it is \u2014 line 247, an off-by-one error. You fix it, run the tests, and watch them pass in a cascade of green.</p><blockquote>Every bug is a lesson in humility. The code is doing exactly what you told it to do.</blockquote><p>There\u2019s something meditative about 3 AM debugging. The world shrinks to you and the code. No Slack. No meetings. Just the quiet satisfaction of making something work.</p>'
  },
  {
    id: "nature-walks",
    title: "Quiet Hours \u2014 Nature Photography",
    category: "photography",
    date: "December 5, 2023",
    readTime: "2 min read",
    excerpt: "Early morning walks in forests and fields, before anyone else is awake.",
    cover: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800",
    body: '<p>I started taking early morning walks during the pandemic. What began as a coping mechanism became a practice I now protect fiercely.</p><div class="gallery"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400" alt="Forest"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400" alt="Misty morning"><img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=400" alt="Trees"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400" alt="Lake"><img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=400" alt="Trail"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400" alt="Valley"></div><p>No podcasts, no music. Just footsteps and whatever the forest offers that morning.</p>'
  }
];

/* ============ APP ============ */
var activeFilter = "all";

document.addEventListener("DOMContentLoaded", function(){
  renderPostCards("all");
});

function renderPostCards(filter){
  var grid = document.getElementById("posts-grid");
  var filtered = filter === "all" ? blogPosts : blogPosts.filter(function(p){return p.category===filter;});
  var html = "";
  for(var i=0;i<filtered.length;i++){
    var post = filtered[i];
    var imgHtml = post.cover
      ? '<img class="post-card-img" src="'+post.cover+'" alt="'+post.title+'" onerror="this.style.display=\'none\'">'
      : '<div class="post-card-img" style="display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2rem;color:var(--text-l);font-style:italic">\u2726</div>';
    html += '<article class="post-card" onclick="viewPost(\''+post.id+'\')" style="animation-delay:'+(.05*(i+1))+'s">'
      + imgHtml
      + '<div class="post-card-body">'
      + '<div class="post-card-cat">'+post.category+'</div>'
      + '<h2>'+post.title+'</h2>'
      + '<p class="excerpt">'+post.excerpt+'</p>'
      + '<div class="post-card-footer"><span>'+post.date+'</span><span>'+post.readTime+'</span></div>'
      + '</div></article>';
  }
  grid.innerHTML = html;
}

function filterPosts(cat){
  activeFilter = cat;
  var btns = document.querySelectorAll(".filter-btn");
  for(var i=0;i<btns.length;i++){
    var t = btns[i].textContent.toLowerCase();
    btns[i].classList.toggle("active", t===cat || (cat==="all" && t==="all"));
  }
  renderPostCards(cat);
}

function filterAndShow(cat){
  showListing();
  filterPosts(cat);
  var navLinks = document.querySelectorAll(".site-nav a");
  for(var i=0;i<navLinks.length;i++) navLinks[i].classList.remove("active");
}

function viewPost(id){
  var post = null;
  for(var i=0;i<blogPosts.length;i++){if(blogPosts[i].id===id){post=blogPosts[i];break;}}
  if(!post) return;
  document.getElementById("pv-cat").textContent = post.category;
  document.getElementById("pv-title").textContent = post.title;
  document.getElementById("pv-date").textContent = post.date;
  document.getElementById("pv-read").textContent = post.readTime;
  document.getElementById("pv-body").innerHTML = post.body;
  var cw = document.getElementById("pv-cover-wrap");
  cw.innerHTML = post.cover ? '<img src="'+post.cover+'" alt="'+post.title+'" onerror="this.style.display=\'none\'">' : '';
  document.getElementById("posts-listing").classList.add("hidden");
  document.getElementById("post-view").classList.add("active");
  window.scrollTo(0,0);
}

function showListing(){
  document.getElementById("posts-listing").classList.remove("hidden");
  document.getElementById("post-view").classList.remove("active");
  var navLinks = document.querySelectorAll(".site-nav a");
  for(var i=0;i<navLinks.length;i++) navLinks[i].classList.remove("active");
  if(navLinks[0]) navLinks[0].classList.add("active");
  window.scrollTo(0,0);
}

/* Mobile nav toggle */
function toggleMobNav(){
  var nav = document.getElementById("site-nav");
  if(nav.classList.contains("expanded")){
    nav.classList.remove("expanded");
    nav.classList.add("collapsed");
  } else {
    nav.classList.remove("collapsed");
    nav.classList.add("expanded");
  }
}
/* Collapse on resize to desktop */
window.addEventListener("resize",function(){
  if(window.innerWidth>700){
    var nav=document.getElementById("site-nav");
    nav.classList.remove("collapsed","expanded");
  }
});
</script>
</body>
</html>
